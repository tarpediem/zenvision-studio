[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zenvision-studio"
version = "0.2.0"
description = "Drive small lid OLED panels (ASUS ZenVision and friends) with live applets and custom animations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Olivier Magnier" }]
keywords = ["asus", "zenbook", "zenvision", "oled", "usb", "applets", "linux"]
classifiers = [
  "Environment :: No Input/Output (Daemon)",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "pyusb>=1.2",
  "pillow>=9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "dbus-next>=0.2.3",
]

[project.optional-dependencies]
video = ["imageio[ffmpeg]>=2.30"]
audio = ["numpy>=1.23"]   # spectrum analyser for the VU-meter (parec is a system dep)
tray = ["pystray>=0.19", "pillow>=9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "numpy>=1.23"]

[project.scripts]
zvstudio = "zvstudio.cli:main"
zvstudio-daemon = "zvstudio.cli:main"

[project.urls]
Homepage = "https://github.com/tarpediem/zenvision-studio"
Protocol = "https://github.com/tarpediem/zenvision-linux"

[tool.hatch.build.targets.wheel]
packages = ["zvstudio"]

[tool.hatch.build.targets.wheel.force-include]
"zvstudio/web" = "zvstudio/web"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP031", "B027"]
